<style>
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:300;font-display:swap;src:url(/assets/fonts/JetBrainsMono-Light.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:swap;src:url(/assets/fonts/JetBrainsMono-Regular.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:500;font-display:swap;src:url(/assets/fonts/JetBrainsMono-Medium.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:700;font-display:swap;src:url(/assets/fonts/JetBrainsMono-Bold.woff2) format('woff2')}

</style>
<style>
__THEME_TOKENS__
  * { box-sizing: border-box; }
  /* scrollbars inherit the theme and recolor with it */
  html { background: var(--desktop); scrollbar-width: thin; scrollbar-color: var(--muted) transparent; }
  body {
    margin: 0; min-height: 100vh;
    background: var(--desktop); color: var(--fg);
    font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9375rem; line-height: 1.55;
    transition: background 0.25s ease;
  }
  ::selection { background: var(--accent); color: var(--win); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; border-radius: 2px; }

  .bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: 6px clamp(8px, 1.2vw, 14px);
    padding-top: calc(6px + env(safe-area-inset-top));
    background: color-mix(in oklab, var(--desktop) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    font-size: 0.8125rem;
    transition: background 0.25s ease;
  }
  .bar__logo { display: flex; align-items: center; color: var(--accent); text-decoration: none; transition: color 0.15s; }
  .bar__logo svg { width: 20px; height: 20px; fill: currentColor; }
  .bar__logo:hover { color: var(--accent-2); }
  .bar__title { flex: 1; text-align: center; color: var(--muted); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .bar__title strong { color: var(--fg); font-weight: 500; }
  .bar__right { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .bar__theme, .bar__search {
    display: flex; align-items: center; gap: 8px;
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--fg); font: inherit; font-size: 0.8125rem;
    padding: 3px 10px; cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  .bar__theme:hover, .bar__search:hover { border-color: var(--accent); background: var(--surface); }
  .bar__theme .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }
  .bar__theme kbd, .bar__search kbd {
    font: inherit; font-size: 0.6875rem; color: var(--muted);
    border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 3px;
    padding: 0 5px;
  }
  .bar__search-burger { display: none; }
  .bar__clock { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) {
    .bar { padding-block: 10px; padding-top: calc(10px + env(safe-area-inset-top)); }
    .bar__title { display: none; }
    .bar__search-label, .bar__search kbd { display: none; }
    .bar__search-burger { display: block; }
    /* the theme button shrinks to its color dot, targets grow to thumb size */
    #theme-name, .bar__theme kbd { display: none; }
    .bar__theme, .bar__search { min-height: 34px; min-width: 42px; justify-content: center; }
    .bar__logo svg { width: 24px; height: 24px; }
  }
  @media (pointer: coarse) { .bar__theme kbd { display: none; } }

  .desktop {
    max-width: 1200px; margin: 0 auto;
    padding: clamp(8px, 1.2vw, 14px);
    display: grid; gap: clamp(8px, 1.2vw, 14px);
  }
  h1 {
    margin: 16px 4px 4px;
    font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em;
  }
  .lede { margin: -4px 4px 4px; color: var(--muted); max-width: 68ch; }
  .lede a { color: var(--fg); text-underline-offset: 3px; }
  .lede a:hover { color: var(--accent-2); }
  .row { display: grid; gap: clamp(8px, 1.2vw, 14px); grid-template-columns: 1fr 1fr; }
  .row--3 { grid-template-columns: 1fr 1fr 1fr; }
  @media (max-width: 900px) { .row--3 { grid-template-columns: 1fr; } }
  @media (max-width: 700px) { .row { grid-template-columns: 1fr; } }

  .win {
    background: var(--win);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 24px;
    transition: border-color 0.2s ease, background 0.25s ease;
    min-width: 0;
  }
  .win:hover, .win:focus-within { border-color: var(--accent); }
  .win__title {
    display: flex; gap: 1ch; align-items: center;
    font-size: 0.8125rem; color: var(--muted);
    margin: 0 0 16px;
    user-select: none;
  }
  .win__title::before { content: "❯"; color: var(--ok); font-weight: 700; }
  /* window head: title left, one secondary action right */
  .win__head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 16px; margin: 0 0 16px; }
  .win__head .win__title { margin: 0; }
  .win__head > a { color: var(--muted); font-size: 0.75rem; text-decoration: none; transition: color 0.15s; flex-shrink: 0; }
  .win__head > a:hover { color: var(--accent-2); }
  .win__head > span { color: var(--muted); font-size: 0.75rem; flex-shrink: 0; }
  /* link arrow, same glyph as the homepage listings */
  a.arrow::after { content: " ↗"; color: var(--accent-2); font-weight: 700; }
  .win h2 { margin: 0 0 8px; font-size: 1rem; font-weight: 700; letter-spacing: -0.01em; }
  .win p { margin: 0 0 12px; color: var(--fg); max-width: 68ch; }
  .win p:last-child { margin-bottom: 0; }
  .win p a, .win li a { color: var(--accent); text-underline-offset: 3px; }
  .win p a:hover, .win li a:hover { color: var(--accent-2); }
  .win .muted { color: var(--muted); }
  .win ul { margin: 0 0 12px; padding-left: 3ch; }
  .win li { margin-bottom: 6px; max-width: 64ch; }
  .win li::marker { color: var(--muted); }
  .win__foot {
    margin: 16px 0 0; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem; color: var(--muted);
  }
  .win__foot a { color: var(--fg); text-underline-offset: 3px; }
  .win__foot a:hover { color: var(--accent-2); }

  .ls { display: grid; gap: 2px; font-size: 0.8125rem; }
  .ls a {
    display: grid; grid-template-columns: 11ch 1fr; column-gap: 2ch; align-items: baseline;
    padding: 6px 10px; margin: 0 -10px;
    border-radius: 4px; text-decoration: none;
    transition: background 0.12s;
    break-inside: avoid;
  }
  .ls a:hover { background: var(--surface); }
  .ls .mode { color: var(--muted); font-weight: 300; }
  .ls .name { color: var(--accent); font-weight: 700; overflow-wrap: anywhere; }
  .ls .desc { grid-column: 2; color: var(--muted); }
  .ls .hint { color: var(--muted); text-align: right; }
  @media (max-width: 480px) {
    .ls a { grid-template-columns: 1fr; }
    .ls .mode { display: none; }
    .ls .desc { grid-column: 1; }
  }

  .btn {
    display: inline-flex; align-items: center; gap: 1ch;
    padding: 10px 18px;
    border-radius: 5px;
    font-weight: 700; font-size: 0.8125rem;
    letter-spacing: 0.04em; text-transform: uppercase;
    text-decoration: none;
    border: 1.5px solid var(--accent);
    background: var(--accent); color: var(--win);
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .btn:hover { background: var(--hover); border-color: var(--hover); }
  .win p a.btn { color: var(--win); }
  .win p a.btn:hover { color: var(--win); }

  /* people rows: a paused-on-hover marquee for larger groups */
  .people { overflow: hidden; display: flex;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
    mask-image: linear-gradient(90deg, transparent, #000 40px, #000 calc(100% - 40px), transparent);
  }
  .people__track { display: flex; flex: 0 0 auto; animation: people-marquee 36s linear infinite; }
  .people:hover .people__track { animation-play-state: paused; }
  .people--static { display: flex; flex-wrap: wrap; mask-image: none; -webkit-mask-image: none; }
  .person {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: 132px; padding: 12px 8px; flex-shrink: 0;
    text-decoration: none; text-align: center;
    border-radius: 4px;
    transition: background 0.12s;
  }
  .person:hover { background: var(--surface); }
  .person img { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--border); }
  /* names reserve two lines so every card sits at the same height */
  .person .name { font-size: 0.8125rem; font-weight: 700; color: var(--fg); min-height: 2.3em; display: flex; align-items: flex-end; justify-content: center; text-align: center; line-height: 1.15; }
  .person .sub { font-size: 0.6875rem; color: var(--muted); }
  @keyframes people-marquee { to { transform: translateX(-100%); } }
  .people--static { mask-image: none; -webkit-mask-image: none; }
  .people--static .people__track { animation: none; flex-wrap: wrap; }

  /* long-form content pulled from the originals */
  .prose { font-size: 0.875rem; }
  .prose > *:first-child { margin-top: 0; }
  .prose h2, .prose h3 { margin: 28px 0 10px; font-weight: 700; letter-spacing: -0.01em; }
  .prose h2 { font-size: 1.0625rem; }
  .prose h3 { font-size: 0.9375rem; }
  .prose h2::before { content: "## "; color: var(--muted); font-weight: 300; }
  .prose h3::before { content: "### "; color: var(--muted); font-weight: 300; }
  .prose .manual__heading-link { color: var(--muted); text-decoration: none; font-weight: 300; margin-left: 1ch; opacity: 0; }
  .prose h2:hover .manual__heading-link, .prose h3:hover .manual__heading-link { opacity: 1; }
  .prose p { margin: 0 0 14px; max-width: 76ch; }
  .prose ul, .prose ol { margin: 0 0 14px; padding-left: 3ch; }
  .prose li { margin-bottom: 6px; max-width: 72ch; }
  .prose li::marker { color: var(--muted); }
  .prose a { color: var(--accent); text-underline-offset: 3px; }
  .prose a:hover { color: var(--accent-2); }
  .prose code, .prose kbd {
    font-family: inherit; font-size: 0.8125rem;
    background: var(--surface); border: 1px solid var(--border); border-radius: 3px;
    padding: 1px 5px;
  }
  .prose pre { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 12px 14px; overflow-x: auto; margin: 0 0 14px; }
  .prose pre code { background: none; border: none; padding: 0; }
  .prose img { max-width: 100%; height: auto; border-radius: 4px; border: 1px solid var(--border); margin: 4px 0 14px; }
  .prose blockquote { margin: 0 0 14px; padding: 8px 16px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted); }
  .prose table { border-collapse: collapse; margin: 0 0 16px; display: block; overflow-x: auto; font-size: 0.8125rem; }
  .prose th, .prose td { border: 1px solid var(--border); padding: 6px 12px; text-align: left; }
  .prose th { color: var(--accent); font-weight: 700; background: color-mix(in oklab, var(--surface) 60%, transparent); }
  .prose td code, .prose td kbd { white-space: nowrap; }
  .prose .news-meta { font-size: 0.75rem; color: var(--muted); margin-bottom: 16px; }
  .prose .news-meta a { color: var(--muted); }

  /* image lightbox */
  .zoomable { cursor: zoom-in; }
  .imgbox { background: var(--win); color: var(--fg); border: 1.5px solid var(--accent); border-radius: 6px; padding: 0; max-width: min(1140px, 94vw); }
  .imgbox:focus { outline: none; }
  .imgbox::backdrop { background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); }
  .imgbox__inner { padding: 12px 14px 14px; }
  .imgbox__bar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 10px; }
  .imgbox__bar .win__title { margin: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .imgbox__close {
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); font: inherit; font-size: 0.8125rem;
    padding: 2px 8px; cursor: pointer; flex-shrink: 0;
    transition: color 0.15s, border-color 0.15s;
  }
  .imgbox__close:hover { color: var(--err); border-color: var(--err); }
  .imgbox__inner > img { display: block; max-width: 100%; max-height: 78vh; width: auto; height: auto; border-radius: 4px; }

  /* manual: sticky chapter toc + content — sticky offset keeps the same
     gap to the bar the layout has before scrolling */
  .docs { display: grid; grid-template-columns: 280px 1fr; gap: clamp(8px, 1.2vw, 14px); align-items: start; }
  .docs__toc { position: sticky; top: calc(var(--bar-h, 48px) + clamp(8px, 1.2vw, 14px)); max-height: calc(100vh - var(--bar-h, 48px) - 24px); overflow-y: auto; }
  .docs__search {
    display: flex; justify-content: space-between; align-items: center; gap: 1ch;
    width: 100%; margin: 0 0 12px; padding: 6px 10px;
    background: none; border: 1px solid var(--border); border-radius: 4px;
    color: var(--muted); font: inherit; font-size: 0.75rem;
    cursor: pointer; transition: border-color 0.15s, color 0.15s;
  }
  .docs__search:hover { border-color: var(--accent); color: var(--fg); }
  .docs__search kbd { font: inherit; font-size: 0.6875rem; border: 1px solid var(--border); border-radius: 3px; padding: 0 5px; }
  .docs__toc ol { margin: 0; padding: 0; list-style: none; counter-reset: ch; font-size: 0.75rem; }
  .docs__toc a {
    display: flex; gap: 1ch; padding: 3px 8px; margin: 0 -8px;
    color: var(--muted); text-decoration: none; border-radius: 3px;
    transition: background 0.12s, color 0.12s;
  }
  .docs__toc a::before { counter-increment: ch; content: counter(ch, decimal-leading-zero); font-weight: 300; opacity: 0.7; }
  .docs__toc a:hover { color: var(--fg); background: var(--surface); }
  .docs__toc a[aria-current="page"] { color: var(--accent); font-weight: 700; }
  @media (max-width: 900px) {
    .docs { grid-template-columns: 1fr; }
    .docs__toc { position: static; max-height: none; }
    .docs__toc ol { column-count: 2; }
    /* the chapter list collapses into a dropdown on small screens */
    .docs__toc .win__title { cursor: pointer; margin-bottom: 0; }
    .docs__toc .win__title::after { content: "▼"; margin-left: auto; color: var(--fg); font-size: 0.75rem; transition: transform 0.15s; }
    .docs__toc.open .win__title::after { transform: rotate(180deg); }
    .docs__toc .docs__search { display: none; }
    .docs__toc-body { display: none; }
    .docs__toc.open .docs__toc-body { display: block; margin-top: 12px; }
  }
  @media (max-width: 560px) { .docs__toc ol { column-count: 1; } }

  /* article page: content + context column */
  .article-grid { display: grid; grid-template-columns: 1fr 320px; gap: clamp(8px, 1.2vw, 14px); align-items: start; }
  .article-grid > aside { position: sticky; top: calc(var(--bar-h, 48px) + clamp(8px, 1.2vw, 14px)); }
  @media (max-width: 900px) {
    .article-grid { grid-template-columns: 1fr; }
    .article-grid > aside { position: static; }
  }
  .index-list { display: grid; gap: 2px; font-size: 0.75rem; }
  .index-list a {
    display: block; padding: 5px 8px; margin: 0 -8px;
    color: var(--fg); text-decoration: none; border-radius: 3px;
    transition: background 0.12s, color 0.12s;
  }
  .index-list a:hover { background: var(--surface); }
  .index-list a[aria-current="page"] { color: var(--accent); font-weight: 700; }
  .index-list .date { display: block; font-size: 0.6875rem; color: var(--muted); }

  /* prev/next pager */
  .pager {
    display: flex; justify-content: space-between; gap: 16px;
    margin-top: 20px; padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
  }
  .pager a { color: var(--fg); text-decoration: none; max-width: 45%; }
  .pager a:hover { color: var(--accent-2); }
  .pager .dir { display: block; color: var(--muted); font-size: 0.6875rem; }
  .pager .pager__next { text-align: right; margin-left: auto; }

  .foot {
    display: flex; flex-direction: column; align-items: center;
    gap: 12px;
    padding: 24px clamp(8px, 1.2vw, 14px) calc(32px + env(safe-area-inset-bottom));
    font-size: 0.8125rem; color: var(--muted); text-align: center;
  }
  .foot p { margin: 0; max-width: none; }
  .foot a { color: var(--fg); text-decoration: none; }
  .foot a:hover { color: var(--accent-2); }
  .foot svg { height: 1.05em; width: auto; fill: currentColor; vertical-align: -0.14em; }
  .foot .cf-mark svg { height: 1.2em; vertical-align: -0.28em; }
  .foot__legal { font-size: 0.6875rem; }
  .foot__legal a { color: var(--muted); }
  @media (max-width: 640px) {
    .foot__makers { display: block; margin-top: 4px; }
  }
__PAGE_CSS__
</style>
</head>
